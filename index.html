<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallux Nail Growth: Click-Through</title>
<style>
:root{--ink:#1b2224;--ink-2:#5d686b;--line:#c6cdc9;--accent:#e4572e;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font:400 14px/1.3 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
button:disabled{opacity:.38;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff}
#gl,#lead{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:grab}
#gl:active{cursor:grabbing}
#lead{pointer-events:none}
#lead polyline{fill:none;stroke:var(--ink);stroke-width:.9;opacity:.7}
#lead circle{fill:var(--ink)}
#over{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;white-space:nowrap;font:600 clamp(11px,1.75vmin,17px)/1.25 var(--ui);padding:.12em .5em .18em;background:rgba(255,255,255,.95);border:1.5px solid var(--ink);border-radius:3px}
#tracer{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:600 clamp(10px,1.5vmin,15px)/1.2 var(--ui);color:#fff;background:var(--accent);border-radius:3px;padding:.15em .45em}
#scale{position:absolute;right:10px;bottom:10px;font:500 clamp(10px,1.5vmin,15px)/1.2 var(--ui);color:var(--ink-2);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:3px;padding:.25em .55em;pointer-events:none}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

#panel{position:absolute;left:10px;top:10px;width:15.2em;font-size:clamp(12px,1.85vmin,17px);display:grid;gap:.5em;padding:.55em;background:rgba(255,255,255,.95);border:1px solid var(--ink);border-radius:5px;box-shadow:0 2px 10px rgba(27,34,36,.12)}
#rows{display:grid;gap:.22em}
.rw{display:grid;grid-template-columns:1fr auto;gap:.2em}
.rw > button:first-child{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.5em;text-align:left;min-height:2.25em;padding:.2em .5em;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink-2)}
.rw i{width:.8em;height:.8em;border-radius:50%;opacity:.35}
.rw b{font-weight:500}
.rw kbd{font:500 .72em/1 var(--ui);color:var(--ink-2);opacity:.6}
.rw > button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:#f3f5f1}
.rw > button[aria-pressed="true"] i{opacity:1}
.rw > button[aria-pressed="true"] b{font-weight:600}
.rw > button.focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rm{display:none;width:2.25em;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink-2);font-size:1em;line-height:1;padding:0}
.rw > button[aria-pressed="true"] + .rm{display:block}
.nav{display:grid;gap:.3em}
#b-next{min-height:2.6em;border:0;border-radius:4px;background:var(--ink);color:#fff;font-weight:600;padding:.3em .6em;text-align:left}
#b-next::before{content:"\25B6\00a0\00a0Next: ";font-weight:500;opacity:.85}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
.trio button,.opts button{min-height:2.15em;border:1px solid var(--line);border-radius:4px;background:#fff;padding:.2em .3em;font-size:.88em;font-weight:500;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(3,auto);gap:.3em}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.rate{display:grid;grid-template-columns:auto repeat(3,1fr);align-items:center;gap:.3em;font-size:.88em;color:var(--ink-2)}
.rate button{min-height:2em;border:1px solid var(--line);border-radius:4px;background:#fff;padding:.15em .3em;font-weight:500;color:var(--ink)}
.rate button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#b-panel{position:absolute;right:10px;top:10px;width:2.3em;height:2.3em;font-size:clamp(12px,1.85vmin,17px);border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.9);color:var(--ink-2);padding:0;line-height:1}
body.nopanel #panel{display:none}
body.film #panel,body.film #b-panel{display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:500 clamp(11px,1.6vmin,15px)/1.2 var(--ui);color:var(--ink-2);opacity:.7;pointer-events:none}
/* a tall stage (a phone held upright): the panel sits along the foot of the stage */
body.tall #panel{left:6px;right:6px;top:auto;bottom:6px;width:auto;gap:.4em;padding:.45em}
body.tall #rows{grid-template-columns:1fr 1fr}
body.tall .rw kbd{display:none}
body.tall .nav{grid-template-columns:1.25fr 1fr}
body.tall .rate{grid-template-columns:auto repeat(3,1fr)}
body.tall #scale{bottom:auto;top:10px;right:auto;left:10px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="3D model of the nail unit of the great toe"></canvas>
  <svg id="lead" aria-hidden="true"></svg>
  <div id="over"><div id="tracer" hidden></div></div>
  <div id="scale" hidden></div>
  <div id="flash"></div>
  <div id="hint" hidden>Click or &rarr; for the next part &middot; &larr; back</div>
  <div id="panel">
    <div id="rows"></div>
    <div class="nav">
      <button type="button" id="b-next"><span></span></button>
      <div class="trio"><button type="button" id="b-wide">Zoom out</button><button type="button" id="b-back">Back</button><button type="button" id="b-reset">Reset</button></div>
    </div>
    <div class="opts"><button type="button" id="b-labels" aria-pressed="true">Labels</button><button type="button" id="b-auto" aria-pressed="true">Auto zoom-out</button><button type="button" id="b-play" aria-pressed="false">Pause</button></div>
    <div class="rate"><span>1 s =</span><button type="button" data-rate="auto" aria-pressed="true">Auto</button><button type="button" data-rate="0.229979">Week</button><button type="button" data-rate="1">Month</button></div>
  </div>
  <button type="button" id="b-panel" aria-label="Show or hide the panel" aria-pressed="true">&#9776;</button>
</div>

ere cells flatten, lose their nuclei and join the plate, with no granular layer.","Chapter: SD4 p48, SD5 p86"],matHorn:["Lateral horn of the matrix",lt.proxMatrix,"In the great toe the lateral margins of matrix and plate reach almost halfway around the terminal phalanx. On ultrasound the tips of the horns lie 1.2 to 1.7 mm further proximally than the tip of the matrix in the midline.","Chapter: BD1 p17. Paper: Ha 2024. Shape assumed"],plateP:["Plate, sheets from the proximal matrix",lt.plateP,"The superficial part of the plate, made by the proximal half of the matrix. It holds 81% of the cells in about two thirds of the thickness, because the upper cells are flatter. The plate is about 0.7 mm thick at mid-matrix, 1.1 mm at the lunula margin and 1.4 mm at the end of the bed.","Papers: J1, J3, B1"],plateD:["Plate, sheets from the distal matrix",lt.plateD,"The deep part of the plate, the lower third in this drawing, with the remaining 19% of the cells. Along the bed the plate thickens by 10 to 20% without gaining cells.","Papers: B1, J1, J2"],bed:["Nail bed epithelium",lt.bed,"Very thin, with no granular layer and no appendages. Flat on top, with longitudinal ridges locked into the tissue beneath. Its basal layer stays in place, and its thin horny layer is carried forward under the plate. Drawn 0.12 mm thick.","Chapter: BD1 p13, SD5 p88. Papers: Z1, B1. Thickness assumed"],band:["Onychodermal band",lt.band,"The distal bed, 0.5 to 1.5 mm wide. The epithelium thickens here and keratinizes abruptly into solehorn. Also described as the nail isthmus.","Chapter: SD5 p89, SD4 p48. Paper: H4"],solehorn:["Solehorn",lt.solehorn,"Dense keratin from the distal bed that seals the plate to the bed. It leaves with the plate as the ventral cuticle.","Chapter: SD4 p48, p56"],ventralCuticle:["Ventral cuticle",lt.vcut,"The outward continuation of the solehorn, a thin film on the underside of the free edge.","Chapter: SD4 p48"],hyponychium:["Hyponychium",lt.epi,"From the line where the plate lifts off to the distal groove. Skin-like epithelium; the granular layer returns abruptly.","Chapter: BD1 p2, SD4 p47, SD5 p88"],hypHorn:["Hyponychial horn",lt.horn,"Orthokeratin shed by the hyponychium into the angle under the free edge.","Chapter: SD4 p47"],distalFold:["Distal groove and distal nail fold",lt.epi,"A shallow furrow marks the distal limit of the nail unit. Beyond it the distal fold runs into the pulp.","Chapter: BD1 p2, SD4 p43"],latGroove:["Lateral nail groove",lt.latGroove,"A potential space holding the plate margin. Its lining is continuous with the bed epithelium below and the fold skin above.","Chapter: SD5 p86, BD1 p14"],latFold:["Lateral nail fold",lt.epi,"Ordinary skin with a tendency to hyperkeratosis. It contains the plate margin. How far it overlaps the plate is drawn, not measured.","Chapter: BD1 p15. Overlap assumed"],sideSkin:["Skin of the side of the toe",lt.epi,"Ordinary skin of the side of the digit, continuous with the lateral fold above and the volar skin below.","Assumed"],volarSkin:["Volar skin of the pulp",lt.epi,"Thick epidermis with a thick horny layer.","Chapter: SD4 p47"],dermis:["Dermis",lt.dermis,"Ordinary dermis of the folds and digit skin.","Chapter: SD4 p56"],onycho:["Dermis of matrix and bed",lt.onycho,"Under the matrix: its own dermis, a thin papillary and a thicker reticular layer, about 1 mm from epithelium to bone (0.87 mm in 13 great toes). Under the bed: dense dermis with fibres anchored to periosteum, about 2.5 mm deep at mid-nail.","Papers: H2, H3, Kim JY 2011, U1"],matHypo:["Fatty layer under the matrix",lt.subcutis,"A thin cushion of fat and loose tissue between the root of the matrix and the periosteum. It continues the fat of the proximal fold and thins out toward the bed. The older chapters draw a posterior ligament here. Stained sections found none in the midline.","Papers: H2, H3 (fingers), H1 abstract (toes). Thickness assumed"],periost:["Periosteum",lt.lig,"A thick fibro-elastic layer on the bone.
